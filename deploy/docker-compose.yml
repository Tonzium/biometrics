# Tuotantopino: db + api + web(nginx) + cloudflared.
# Yksikään palvelu ei julkaise portteja isäntäkoneelle; liikenne tulee vain tunnelin kautta.
#
# Imaget tulevat valmiina GitHub Container Registrystä (CI rakentaa ne jokaisella pushilla):
#
#   cp deploy/.env.example deploy/.env   # täytä arvot
#   docker compose -f deploy/docker-compose.yml pull
#   docker compose -f deploy/docker-compose.yml up -d
#
# Paikallinen build lähdekoodista: lisää -f deploy/docker-compose.build.yml (ks. docker-compose.local.yml).

name: polar-data-hub

# Lokien kierrätys. Dockerin oletusajuri kasvattaa json-lokia rajatta, ja
# pyyntötulva kirjoittaa sekä nginxin pääsylokia että api:n hylkäysrivejä
# samalle levylle, jolla kannan data on. Käytössä niissä palveluissa, jotka
# kirjoittavat lokia joka pyynnöstä.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # Prosessi ei voi hankkia lisäoikeuksia setuid-binäärillä. Tämä on turvassa
    # kaikille palveluille; kyvykkyyksiä (cap_drop) ei karsita db:ltä, koska
    # postgres-image tarvitsee niitä datahakemiston omistajan vaihtoon.
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polar}
      POSTGRES_USER: ${POSTGRES_USER:-polar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Aseta POSTGRES_PASSWORD .env-tiedostoon}
      # Sovelluksen oma, rajoitettu rooli. Nämä luetaan vain init-skriptissä
      # (deploy/initdb), joka ajetaan ensimmäisellä käynnistyksellä. Tyhjä arvo =
      # roolia ei luoda, ja api käyttää superuseria kuten ennen.
      DB_APP_USER: ${DB_APP_USER:-}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-}
    volumes:
      # Postgres 18 -image käyttää koko /var/lib/postgresql-hakemistoa datalle
      - pgdata:/var/lib/postgresql
      # Ajetaan VAIN kun datahakemisto on tyhjä. Olemassa olevaan kantaan rooli
      # lisätään kertaluonteisesti: deploy/sql/app-role-handover.sql.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polar} -d ${POSTGRES_DB:-polar}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/tonzium/biometrics}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    # api ajaa jo ei-root-käyttäjänä (uid 10001) ja kuuntelee porttia 8080,
    # joten se ei tarvitse yhtään Linux-kyvykkyyttä.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Nimetty lista muuttujista, jotka api-prosessi saa. Tässä oli ennen
    # `env_file: .env`, jolloin KOKO deploy/.env valui api-prosessiin – myös
    # CLOUDFLARE_TUNNEL_TOKEN. Sillä tokenilla api:n kaapannut hyökkääjä voisi
    # ajaa oman cloudflaredin ja ohjata julkisen osoitteen omalle palvelimelleen,
    # joten token näkyy vain cloudflared-kontille. Kantatunnukset api saa
    # edelleen DATABASE_URL:ssa, jota se tarvitsee, mutta ei erillisinä
    # POSTGRES_*-muuttujina.
    #
    # YLLÄPITO: jos backend alkaa lukea uutta ympäristömuuttujaa, lisää se tähän
    # listaan JA deploy/.env.example-tiedostoon. Muuten api ei näe sitä lainkaan:
    # virhettä ei tule, vaan asetus jää hiljaa config.rs:n oletusarvoon. CI
    # tarkistaa tämän (ks. .github/workflows/ci.yml).
    environment:
      # Kanta on aina compose-verkon `db`; .env:n DATABASE_URL koskee vain kehitystä.
      #
      # api yhdistää rajoitetulla sovellusroolilla, jos DB_APP_USER ja
      # DB_APP_PASSWORD on asetettu; muuten superuserilla kuten ennen. Näin
      # pelkkä uuden compose-tiedoston käyttöönotto ei muuta mitään, ja
      # paluu entiseen on kahden rivin kommentointi .env:issä.
      # Aseta molemmat tai ei kumpaakaan — deploy.sh tarkistaa tämän, koska
      # puolittainen asetus antaisi väärän käyttäjä/salasana-yhdistelmän.
      DATABASE_URL: postgres://${DB_APP_USER:-${POSTGRES_USER:-polar}}:${DB_APP_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB:-polar}
      # Kontin sisäinen portti; nginx tekee proxy_pass http://api:8080.
      BIND_ADDR: 0.0.0.0:8080
      # Pakolliset salaisuudet. Ei `:?`-muotoa, koska compose tulkitsee tyhjän
      # arvon puuttuvaksi ja CI validoi nämä tiedostot ilman .env:iä. Tyhjä tai
      # puuttuva arvo kaataa silti api:n heti käynnistyksessä (config.rs
      # `required()`: "JWT_SECRET is not set" / "JWT_SECRET is empty").
      JWT_SECRET: ${JWT_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      # Valinnaiset: tyhjä arvo tarkoittaa "ei asetettu", jolloin oletus tulee
      # config.rs:stä (SESSION_HOURS 168, COOKIE_SECURE true, PUBLIC_READ true,
      # PUBLIC_BODY_METRICS false, SYNC_INTERVAL_HOURS 6).
      SESSION_HOURS: ${SESSION_HOURS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      PUBLIC_READ: ${PUBLIC_READ:-}
      PUBLIC_BODY_METRICS: ${PUBLIC_BODY_METRICS:-}
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-}
      # Polar-tunnukset: kaikki kolme tai ei yhtään (config.rs kaatuu välimuodosta).
      POLAR_CLIENT_ID: ${POLAR_CLIENT_ID:-}
      POLAR_CLIENT_SECRET: ${POLAR_CLIENT_SECRET:-}
      POLAR_REDIRECT_URL: ${POLAR_REDIRECT_URL:-}
      # Vain tyhjään kantaan luotavaan omistajakäyttäjään (seed.rs). Kun omistaja
      # on luotu, nämä voi poistaa .env:stä (ks. docs/JULKAISU.md).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Tämän lukee tracing_subscriber, ei config.rs. Oletus kirjoitettu auki:
      # tyhjä arvo ylikirjoittaisi imagen `ENV RUST_LOG=info` ja hiljentäisi lokit.
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/tonzium/biometrics}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    # web käyttää nginx-unprivileged-imagea, jossa myös nginxin pääprosessi ajaa
    # uid 101:llä. Siksi se ei tarvitse yhtään kyvykkyyttä. Tässä oli ennen
    # CHOWN, SETGID ja SETUID (rootina käynnistyvä nginx pudottaa työprosessit
    # nginx-käyttäjälle) sekä NET_BIND_SERVICE portin 80 varaamiseen.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Portti pysyy 80:ssä, jotta Cloudflaren tunnelin kohde (web:80) ei vaadi
    # käsin tehtävää muutosta eikä sivusto käy alhaalla. Ei-root-prosessi saa
    # varata alle 1024:n portin vain, jos tätä rajaa lasketaan. Asetus koskee
    # VAIN tämän kontin omaa verkkonimiavaruutta, jossa ei aja mitään muuta kuin
    # nginx, joten se ei anna hyökkääjälle uutta kykyä: portin varaaminen omassa
    # nimiavaruudessa ei johda mihinkään.
    #
    # Mitattu: NET_BIND_SERVICE ei korvaa tätä. Docker ei aseta
    # ambient-kyvykkyyksiä, joten kyvykkyys ei välity ei-root-prosessille, ja
    # pelkällä cap_add:lla nginx kaatuu virheeseen "bind() to 0.0.0.0:80 failed
    # (13: Permission denied)". Huomaa myös, että Docker Desktop (WSL2) laskee
    # tämän rajan nollaan valmiiksi, tavallinen Linux-palvelin ei: ilman tätä
    # riviä pino toimisi kehityskoneella ja kaatuisi palvelimella.
    #
    # Jos jokin isäntä ei hyväksy tätä sysctlia, vaihtoehto on vaihtaa
    # frontend/nginx.conf:n `listen 80` -> `listen 8080` (ja
    # docker-compose.local.yml:n 8088:80 -> 8088:8080) sekä tunnelin kohde
    # web:8080:aan.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Tyhjä token kaataa vain cloudflared-kontin (näkyy lokissa), ei koko pinoa.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  pgdata:
