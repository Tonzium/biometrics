# Kehityskanta: vain PostgreSQL, portti auki localhostiin.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# Backend ajetaan `cargo run` ja frontend `npm run dev` isäntäkoneella.

name: polar-data-hub-dev

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: polar
      POSTGRES_USER: polar
      POSTGRES_PASSWORD: polar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polar -d polar"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata_dev:
