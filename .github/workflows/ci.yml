name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: polar
          POSTGRES_USER: polar
          POSTGRES_PASSWORD: polar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polar -d polar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://polar:polar@localhost:5432/polar
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format
        run: cargo fmt --all --check

      # Offline-tila: jos .sqlx ei ole ajan tasalla, käännös epäonnistuu tässä.
      - name: Clippy (offline query data)
        run: cargo clippy --all-targets --locked -- -D warnings
        env:
          SQLX_OFFLINE: "true"

      # Makrot käännetään offline-datalla myös täällä: palvelukanta on tyhjä (ei migraatioita).
      # #[sqlx::test] luo ajon aikana väliaikaiset kannat DATABASE_URL:iin ja ajaa migraatiot itse.
      - name: Tests
        run: cargo test --locked
        env:
          SQLX_OFFLINE: "true"

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker images (GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      # ghcr.io/<owner>/<repo>-api ja -web; metadata-action muuntaa nimen pieniksi kirjaimiksi.
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Pull requestit vain rakentavat; push oletushaaraan julkaisee `latest`- ja sha-tagit.
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags for api image
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Tags for web image
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build (and push) backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build (and push) frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Compose-tiedostot eivät enää tarvitse .env-tiedostoa validointiin: api
      # saa muuttujat nimetystä environment-listasta (ei env_file), ja vain
      # db-palvelun POSTGRES_PASSWORD on pakollinen. Muut interpolaatiot menevät
      # tyhjiksi: compose varoittaa lokissa, mutta paluukoodi on 0.
      - name: Validate compose files
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml -f deploy/docker-compose.local.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci

      # Jokaisen backendin lukeman ympäristömuuttujan on oltava api-palvelun
      # environment-listalla. Muuten compose ei välitä sitä konttiin lainkaan ja
      # asetus jäisi tuotannossa hiljaa oletusarvoonsa.
      - name: Env allowlist covers every variable the backend reads
        run: |
          allowlist=$(awk '/^  api:$/{f=1;next} f&&/^  [a-z]/{exit} f' deploy/docker-compose.yml | grep -oE '^      [A-Z][A-Z_0-9]*:' | tr -d ' :' | sort -u)
          read_vars=$(grep -ohE '(optional_parsed|optional|required|env::var)\("[A-Z_0-9]+"' backend/crates/api/src/config.rs | grep -oE '[A-Z_0-9]{3,}' | sort -u)
          echo "api environment: $(echo $allowlist)"
          status=0
          # RUST_LOG luetaan tracing_subscriberin EnvFilterillä, ei config.rs:ssä.
          for v in $read_vars RUST_LOG; do
            echo "$allowlist" | grep -qx "$v" || { echo "PUUTTUU api-palvelun environment-listalta: $v"; status=1; }
          done
          exit $status
