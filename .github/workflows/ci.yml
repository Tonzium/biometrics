name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Oletusoikeudet koko työnkululle: pelkkä luku. Yksittäinen työ nostaa
# oikeuksia vain jos tarvitsee (docker-työ tarvitsee packages: write).
# Ilman tätä työnkulun token saisi repon oletusoikeudet, jotka voivat olla
# kirjoitusoikeudet – turha valtuus jokaiselle askeleelle ja jokaiselle
# kolmannen osapuolen actionille, joita askeleet ajavat.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Kolmannen osapuolen actionit on kiinnitetty commitin SHA:han, ei liikkuvaan
# tagiin. `@v4` osoittaa aina uusimpaan v4-julkaisuun, joten actionin tekijän
# tilin kaappaus tai yksi huono julkaisu muuttaisi sen, mitä CI ajaa, ilman
# yhtään muutosta tässä repossa. SHA on muuttumaton. Kommentissa oleva
# versionumero kertoo, mitä julkaisua SHA vastaa; Dependabot päivittää
# molemmat (ks. .github/dependabot.yml).
jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: polar
          POSTGRES_USER: polar
          POSTGRES_PASSWORD: polar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polar -d polar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://polar:polar@localhost:5432/polar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 12.9.2026
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend

      - name: Format
        run: cargo fmt --all --check

      # Offline-tila: jos .sqlx ei ole ajan tasalla, käännös epäonnistuu tässä.
      - name: Clippy (offline query data)
        run: cargo clippy --all-targets --locked -- -D warnings
        env:
          SQLX_OFFLINE: "true"

      # Makrot käännetään offline-datalla myös täällä: palvelukanta on tyhjä (ei migraatioita).
      # #[sqlx::test] luo ajon aikana väliaikaiset kannat DATABASE_URL:iin ja ajaa migraatiot itse.
      - name: Tests
        run: cargo test --locked
        env:
          SQLX_OFFLINE: "true"

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      # Vain tuotantoriippuvuudet: kehitystyökalujen haavoittuvuus ei päädy
      # julkaistuun bundleen eikä saa kaataa putkea. Kynnys high, jotta
      # matalan vakavuuden löydös ei estä työtä – ne näkyvät silti lokissa.
      - name: Dependency audit (npm)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  audit:
    name: Dependencies (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 12.9.2026
        with:
          toolchain: 1.98.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Vertaa Cargo.lockia RustSecin haavoittuvuustietokantaan. Kaatuu
      # haavoittuvuudesta, varoittaa ylläpitämättömistä kirjastoista.
      # Tietoisesti ohitetut löydökset perusteluineen: backend/.cargo/audit.toml
      - name: Audit Rust dependencies
        working-directory: backend
        run: cargo audit

  docker:
    name: Docker images (GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      # ghcr.io/<owner>/<repo>-api ja -web; metadata-action muuntaa nimen pieniksi kirjaimiksi.
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Pull requestit vain rakentavat; push oletushaaraan julkaisee `latest`- ja sha-tagit.
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags for api image
        id: meta_api
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Tags for web image
        id: meta_web
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build (and push) backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build (and push) frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Compose-tiedostot eivät enää tarvitse .env-tiedostoa validointiin: api
      # saa muuttujat nimetystä environment-listasta (ei env_file), ja vain
      # db-palvelun POSTGRES_PASSWORD on pakollinen. Muut interpolaatiot menevät
      # tyhjiksi: compose varoittaa lokissa, mutta paluukoodi on 0.
      - name: Validate compose files
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml -f deploy/docker-compose.local.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci

      # Jokaisen backendin lukeman ympäristömuuttujan on oltava api-palvelun
      # environment-listalla. Muuten compose ei välitä sitä konttiin lainkaan ja
      # asetus jäisi tuotannossa hiljaa oletusarvoonsa.
      - name: Env allowlist covers every variable the backend reads
        run: |
          allowlist=$(awk '/^  api:$/{f=1;next} f&&/^  [a-z]/{exit} f' deploy/docker-compose.yml | grep -oE '^      [A-Z][A-Z_0-9]*:' | tr -d ' :' | sort -u)
          read_vars=$(grep -ohE '(optional_parsed|optional|required|env::var)\("[A-Z_0-9]+"' backend/crates/api/src/config.rs | grep -oE '[A-Z_0-9]{3,}' | sort -u)
          n_allow=$(printf '%s\n' "$allowlist" | grep -c . || true)
          n_read=$(printf '%s\n' "$read_vars" | grep -c . || true)
          echo "api environment ($n_allow): $(echo "$allowlist" | xargs)"
          echo "config.rs reads ($n_read): $(echo "$read_vars" | xargs)"
          # Tyhjä tulos tarkoittaa, että hakulauseke ei enää osu (tiedosto
          # siirtyi, nimet muuttuivat, rustfmt katkaisi rivin). Ilman tätä
          # tarkistus menisi läpi tarkistamatta mitään.
          if [ "$n_allow" -lt 10 ] || [ "$n_read" -lt 10 ]; then
            echo "VIRHE: tarkistus ei löytänyt odotettua määrää muuttujia. Hakulauseke on vanhentunut, korjaa tämä vaihe."
            exit 1
          fi
          status=0
          # RUST_LOG luetaan tracing_subscriberin EnvFilterillä, ei config.rs:ssä.
          for v in $read_vars RUST_LOG; do
            echo "$allowlist" | grep -qx "$v" || { echo "PUUTTUU api-palvelun environment-listalta: $v"; status=1; }
          done
          exit $status
