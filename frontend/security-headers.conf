# Turvaotsakkeet, jotka lisätään jokaiseen vastaukseen.
#
# Tämä tiedosto sisällytetään (include) nginx.conf:ssa server-tasolle ja
# ERIKSEEN jokaiseen location-lohkoon. Syy: nginx perii `add_header`-rivit
# ylemmältä tasolta vain jos nykyinen taso ei määrittele yhtään omaa
# `add_header`-riviä. Sekä /assets/ että / asettavat Cache-Controlin, joten
# server-tason otsakkeet eivät periytyisi niihin lainkaan. Kun arvot ovat
# tässä tiedostossa, niitä tarvitsee muuttaa vain yhdessä paikassa.
#
# `always` lisää otsakkeen myös virhevastauksiin (401, 404, 502 ...), ei vain
# onnistuneisiin.

# Pakottaa selaimen käyttämään HTTPS:ää jatkossa. Huom: selain ottaa tämän
# huomioon vain HTTPS-vastauksesta (RFC 6797), joten tämä ei korvaa
# Cloudflaren "Always Use HTTPS" -uudelleenohjausta vaan täydentää sitä.
# Koskee vain tätä nimeä ja sen alinimiä, ei juurta tonikiuru.com.
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

# Selain ei saa arvailla sisältötyyppiä Content-Typen ohi.
add_header X-Content-Type-Options "nosniff" always;

# Sivua ei saa upottaa kehykseen (clickjacking, esim. asetussivun napit).
# Sama asia on CSP:n frame-ancestors-direktiivissä; tämä kattaa vanhat selaimet.
add_header X-Frame-Options "DENY" always;

# Referer-otsake vain omalle originille; ulospäin pelkkä origin ja vain HTTPS:llä.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Sovellus ei käytä yhtäkään näistä selainrajapinnoista.
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Eristää selainikkunan muista originista (window.opener-hyökkäykset).
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Muut sivustot eivät saa noutaa tämän sivuston resursseja omiin dokumentteihinsa.
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Content-Security-Policy. Sama koko originilla, myös /api/-polulla:
#   default-src 'self'        kaikki oletuksena vain omasta originista
#   script-src 'self'         sekä React-build että Swagger UI lataavat kaiken
#                             JS:n erillisinä tiedostoina, inline-skriptejä ei
#                             ole eikä 'unsafe-eval'-tarvetta
#   style-src 'unsafe-inline' tarvitaan vain Swagger UI:lle (/api/docs/), joka
#                             asettaa yhden inline-tyylin. React ja Recharts
#                             eivät tarvitse tätä: ne asettavat tyylit DOM:n
#                             style-rajapinnan kautta, jota CSP ei koske –
#                             varmistettu ajamalla sovellus arvolla
#                             style-src 'self' (kaaviot piirtyivät oikein eikä
#                             konsoliin tullut yhtään rikkomusta)
#   img-src data:             Swagger UI:n tyylitiedosto käyttää data:-kuvia
#                             (CSS:n taustakuvat kuuluvat img-src:n alle)
#   connect-src 'self'        fetch/XHR vain omaan /api:in
#   base-uri / object-src / frame-ancestors  suljettu kokonaan
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
