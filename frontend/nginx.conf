# Tuotannon nginx: palvelee React-buildin ja välittää /api-kutsut backendille.
# Toimii Cloudflare Tunnelin takana, joten TLS päätetään Cloudflaressa.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare välittää alkuperäisen IP:n; lokitetaan se.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API backendille. Cookiet ja otsakkeet kulkevat sellaisenaan.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;   # synkronointi voi kestää
    }

    # Sormenjäljitetyt build-tiedostot saa välimuistittaa pitkään.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: kaikki muut polut palauttavat index.html:n (react-router hoitaa reitityksen).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
