# Tuotannon nginx: palvelee React-buildin ja välittää /api-kutsut backendille.
# Toimii Cloudflare Tunnelin takana, joten TLS päätetään Cloudflaressa.
#
# Turvaotsakkeet ovat tiedostossa security-headers.conf, joka sisällytetään
# server-tasolle ja erikseen jokaiseen location-lohkoon. nginx perii
# `add_header`-rivit ylemmältä tasolta vain jos nykyinen taso ei aseta omia
# add_header-rivejä, ja /assets/ sekä / asettavat Cache-Controlin — ilman
# erillistä includea ne jäisivät huomaamatta ilman turvaotsakkeita. Jos lisäät
# uuden location-lohkon, lisää myös include.

# Yhteydet backendiin pidetään auki. Ilman keepalivea nginx avaa jokaiselle
# pyynnölle uuden TCP-yhteyden api-konttiin, ja kovassa pyyntötulvassa kontin
# efemeeriset portit loppuvat: nginx alkaa palauttaa 502 (connect() ...
# 99: Address not available) vaikka backend itse vastaisi normaalisti.
# Mitattu paikallisesti 24 rinnakkaisella säikeellä 12 sekuntia: ilman tätä
# 9971 kpl 502-vastauksia, tämän kanssa 0.
upstream api_upstream {
    server api:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ei kerrota nginxin versiota Server-otsakkeessa eikä virhesivuilla.
    server_tokens off;

    # Cloudflare välittää alkuperäisen IP:n; lokitetaan se.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Kattaa vastaukset, jotka eivät osu mihinkään location-lohkoon
    # (nginxin itse tuottamat virheet, esim. 400 viallisesta pyynnöstä).
    include /etc/nginx/snippets/security-headers.conf;

    # API backendille. Cookiet ja otsakkeet kulkevat sellaisenaan.
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        # Tyhjä Connection-otsake on keepaliven edellytys: muuten asiakkaan
        # oma Connection-otsake välittyisi backendille ja yhteys suljettaisiin.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;   # synkronointi voi kestää

        include /etc/nginx/snippets/security-headers.conf;
    }

    # Sormenjäljitetyt build-tiedostot saa välimuistittaa pitkään.
    # Cache-Controlissa ei ole `always`, jotta 404 ei saa vuoden välimuistitusta.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;

        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA: kaikki muut polut palauttavat index.html:n (react-router hoitaa reitityksen).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;

        include /etc/nginx/snippets/security-headers.conf;
    }
}
